        <div class="value"><div class="num">03</div><h3 data-t="v3"></h3><p data-t="v3d"></p></div>
        <div class="value"><div class="num">04</div><h3 data-t="v4"></h3><p data-t="v4d"></p></div>

    <div class="wrap">
      <div class="head-row reveal">
        <div>

        <img class="tall" src="images/hero/g_i1534.webp" alt="" loading="lazy">

    <div class="wrap">
      <div class="cta-band reveal">
        <div><h2 data-t="c_title"></h2><p data-t="c_text" style="margin-top:10px"></p></div>

          <a href="location.html" class="btn btn-dark" data-t="c_btn"></a>
          <a href="menu.html" class="btn btn-line" data-t="v_cta"></a>
        </div>
      </div>
    </div>
